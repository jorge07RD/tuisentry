[package]
name = "tuisentry"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "TUI ligera para monitorear servicios, usable con mouse y desde el celular"
license = "MIT"
repository = "https://github.com/jorge07RD/tuisentry"
readme = "README.md"
keywords = ["tui", "monitoring", "uptime", "ratatui", "status"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surge-ping = "0.9.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "process", "sync", "signal", "io-util"] }
toml = "1.1.8"
toml_edit = "0.25.17"
x509-parser = "0.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
